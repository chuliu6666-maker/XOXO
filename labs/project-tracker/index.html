  <script>
    // Loading status stays accessible while the visible shell remains image-only.
    window.addEventListener('error', event => {
      if (event.target?.tagName === 'SCRIPT') document.querySelector('#loading').setAttribute('aria-label','模块加载失败，请通过本地 HTTP 服务打开此目录。');
    }, true);
    setTimeout(() => { const el = document.querySelector('#loading'); if (el && !el.hidden) el.setAttribute('aria-label','正在载入作品，请检查本地HTTP服务与WebGL 2支持。'); }, 12000);
  </script>
